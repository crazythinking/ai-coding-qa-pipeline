# ai-coding-qa-pipeline 架构约束契约模板(import-linter,由 pipeline-setup 落地)。
# 命令: lint-imports(需 install 后提供;或 python -m importlinter)
# 替换 <pkg> 为项目根包名。契约：外层模块禁止引用层内模块,保持依赖方向由外向内。

[tool:importlinter]
root_package = <pkg>
include_external_packages = True
ignore_imports =

# 契约 1:应用层不得引用基础设施层
[tool:importlinter.contracts.one]
name = application-does-not-import-infrastructure
type = layers
layers =
    <pkg>.application
    <pkg>.infrastructure

# 契约 2:领域分层(按需增删)
[tool:importlinter.contracts.two]
name = domain-layer-rule
type = layers
layers =
    <pkg>.domain
    <pkg>.application
    <pkg>.infrastructure

# 契约 3:禁止循环依赖(如检测到可注释 # ignore_imports 豁免并注明理由)
[tool:importlinter.contracts.three]
name = no-cycles
type = independence
modules =
    <pkg>.domain
    <pkg>.application
    <pkg>.infrastructure